<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visualizador 4D</title>
<style>
  :root { --bg:#f5f5f2; --fg:#1d1d1b; --card:#fff; --mut:#6b6b66; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#161615; --fg:#eee; --card:#222220; --mut:#a3a39c; } }
  :root[data-theme="dark"] { --bg:#161615; --fg:#eee; --card:#222220; --mut:#a3a39c; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px system-ui,sans-serif; }
  #cena { position:absolute; inset:0; }
  #painel { position:absolute; left:12px; right:12px; bottom:12px; background:var(--card); border-radius:10px; padding:12px 14px; box-shadow:0 2px 12px rgba(0,0,0,.15); max-width:720px; margin:auto; }
  #barra { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  #slider { flex:1; min-width:180px; }
  #data { font-variant-numeric:tabular-nums; min-width:92px; }
  #legenda { display:flex; gap:12px; flex-wrap:wrap; margin-top:8px; color:var(--mut); font-size:12px; }
  #legenda span::before { content:""; display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; vertical-align:middle; background:var(--c); }
  #status { color:var(--mut); margin-top:6px; font-size:12px; }
  button,input[type=file] { font:inherit; }
  #carregar { position:absolute; top:12px; left:12px; background:var(--card); padding:10px; border-radius:8px; box-shadow:0 2px 12px rgba(0,0,0,.15); }
  #associar { position:absolute; top:12px; right:12px; width:280px; background:var(--card); padding:10px 12px; border-radius:8px; box-shadow:0 2px 12px rgba(0,0,0,.15); font-size:13px; }
  #associar h3 { margin:0 0 6px; font-size:14px; }
  #associar select { width:100%; margin:6px 0; font:inherit; }
  #associar .botoes { display:flex; flex-wrap:wrap; gap:6px; }
  #associar .botoes button { flex:1 1 45%; padding:5px; font:inherit; cursor:pointer; }
  #associar small { color:var(--mut); display:block; margin-top:6px; }
  #aviso { color:var(--mut); margin-top:6px; min-height:1.2em; }
</style>
</head>
<body>
<div id="cena"></div>

<div id="carregar">
  <label>Modelo IFC: <input type="file" id="arquivoIfc" accept=".ifc"></label><br>
  <label>Cronograma (JSON): <input type="file" id="arquivoCron" accept=".json"></label><br>
  <label>Vínculos (JSON): <input type="file" id="arquivoVinc" accept=".json"></label>
</div>

<div id="associar">
  <h3>Associar à EAP</h3>
  <div id="contagemSel">Nenhum elemento selecionado.</div>
  <select id="atividade" disabled><option>Carregue o cronograma</option></select>
  <div class="botoes">
    <button id="btnAssociar" disabled>Associar</button>
    <button id="btnRemover" disabled>Remover vínculo</button>
    <button id="btnSugerir" disabled>Sugerir por semelhança</button>
    <button id="btnLimpar" disabled>Limpar seleção</button>
    <button id="btnExportarVinc" disabled>Exportar vínculos</button>
    <button id="btnExportarAprend" disabled>Exportar aprendizado</button>
  </div>
  <label style="display:block;margin-top:8px;">Aprendizado (JSON): <input type="file" id="arquivoAprend" accept=".json"></label>
  <small>Clique num elemento para selecionar. Ctrl+clique adiciona ou remove da seleção.</small>
  <div id="aviso"></div>
</div>

<div id="painel">
  <div id="barra">
    <button id="play">▶ Reproduzir</button>
    <input id="slider" type="range" min="0" max="0" value="0">
    <span id="data">--/--/----</span>
  </div>
  <div id="legenda">
    <span style="--c:#9e9e9e">Não iniciado</span>
    <span style="--c:#1e88e5">Em execução</span>
    <span style="--c:#43a047">Concluído</span>
    <span style="--c:#e53935">Atrasado</span>
    <span style="--c:#d7ccc8">Sem vínculo</span>
  </div>
  <div id="status">Carregue o IFC, o cronograma e os vínculos para começar.</div>
</div>

<script type="module" src="./viewer4d.js"></script>
</body>
</html>
